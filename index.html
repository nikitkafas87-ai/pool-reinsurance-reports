<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пул ОСАГО - отчеты</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f6f8;color:#172033}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 40px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:18px}
h1{margin:0;font-size:24px;line-height:1.2}
.meta{margin:6px 0 0;color:#667085;font-size:13px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.tab{border:1px solid #d7dde5;background:#fff;color:#29364a;border-radius:7px;padding:9px 13px;font-size:14px;cursor:pointer}
.tab.active{background:#243447;color:#fff;border-color:#243447}
.panel{display:none}
.panel.active{display:block}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid #e3e7ed;border-radius:8px;padding:12px}
.stat b{display:block;font-size:20px;margin-bottom:3px}
.stat span{font-size:12px;color:#667085}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e3e7ed;border-radius:8px;overflow:hidden}
th{background:#243447;color:#fff;text-align:left;font-size:12px;font-weight:650;padding:11px 12px;white-space:nowrap}
td{font-size:13px;padding:11px 12px;border-top:1px solid #eef1f5;vertical-align:top}
tr:hover td{background:#f9fbfd}
a{color:#1d5fd1;text-decoration:none}
a:hover{text-decoration:underline}
.pill{display:inline-block;border-radius:999px;padding:3px 8px;font-size:12px;background:#edf2f7;color:#344054}
.passed{background:#e7f7ed;color:#126b39}
.failed{background:#fdecec;color:#a12626}
.blocked{background:#fff4df;color:#8a5a00}
.empty{background:#fff;border:1px dashed #cfd6df;border-radius:8px;padding:22px;color:#667085;text-align:center}
.foot{margin-top:18px;color:#667085;font-size:12px}
@media(max-width:780px){
  .top{display:block}
  .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  table{display:block;overflow-x:auto}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <h1>Пул ОСАГО - отчеты</h1>
      <p class="meta">Отдельный индекс активных проверок перестраховочного пула и безопасных снимков кеша.</p>
    </div>
    <p class="meta" id="updated">Обновление: -</p>
  </div>

  <nav class="tabs" aria-label="Разделы">
    <button class="tab active" data-tab="devReports">ДЭВ отчеты</button>
    <button class="tab" data-tab="prodReports">ПРОД отчеты</button>
    <button class="tab" data-tab="devCache">ДЭВ кеш</button>
    <button class="tab" data-tab="prodCache">ПРОД кеш</button>
  </nav>

  <section class="panel active" id="devReports"></section>
  <section class="panel" id="prodReports"></section>
  <section class="panel" id="devCache"></section>
  <section class="panel" id="prodCache"></section>

  <p class="foot">В отчетах и снимках кеша не должно быть сырых тел анкет, API-ключей и персональных данных.</p>
</main>

<script>
const state = { reports: { dev: [], prod: [] }, cache: { dev: [], prod: [] } };

const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[ch]));

function statusClass(status) {
  const value = String(status || "").toLowerCase();
  if (value === "passed" || value === "working") return "passed";
  if (value.startsWith("failed") || value === "stale" || value === "invalid") return "failed";
  if (value.startsWith("blocked") || value === "needsrefresh") return "blocked";
  return "";
}

function statBlock(items) {
  const total = items.length;
  const passed = items.filter(x => x.status === "passed" || x.status === "working").length;
  const failed = items.filter(x => String(x.status || "").startsWith("failed") || x.status === "stale" || x.status === "invalid").length;
  const blocked = items.filter(x => String(x.status || "").startsWith("blocked") || x.status === "needsRefresh").length;
  return `<div class="summary">
    <div class="stat"><b>${total}</b><span>Всего</span></div>
    <div class="stat"><b>${passed}</b><span>Успешно / рабочие</span></div>
    <div class="stat"><b>${failed}</b><span>Ошибки / устарели</span></div>
    <div class="stat"><b>${blocked}</b><span>Блокировки / обновить</span></div>
  </div>`;
}

function reportTable(items) {
  if (!items.length) return '<div class="empty">Отчетов пока нет</div>';
  const rows = items.map((item, index) => `<tr>
    <td>${index + 1}</td>
    <td><a href="${esc(item.href)}">${esc(item.title || item.slug || "Открыть")}</a></td>
    <td>${esc(item.date || "")}</td>
    <td>${esc(item.environment || "")}</td>
    <td>${esc(item.insurers || "")}</td>
    <td><span class="pill ${statusClass(item.status)}">${esc(item.status || "")}</span></td>
    <td>${esc(item.summary || "")}</td>
  </tr>`).join("");
  return `<table>
    <thead><tr><th>#</th><th>Отчет</th><th>Дата</th><th>Среда</th><th>СК</th><th>Статус</th><th>Итог</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function cacheTable(items) {
  if (!items.length) return '<div class="empty">Снимков кеша пока нет</div>';
  const rows = items.map((item, index) => `<tr>
    <td>${index + 1}</td>
    <td><a href="${esc(item.href)}">${esc(item.title || item.slug || "Открыть")}</a></td>
    <td>${esc(item.date || "")}</td>
    <td>${esc(item.environment || "")}</td>
    <td>${esc(item.alias || "")}</td>
    <td><span class="pill ${statusClass(item.status)}">${esc(item.status || "")}</span></td>
    <td>${esc(item.lastResult || "")}</td>
  </tr>`).join("");
  return `<table>
    <thead><tr><th>#</th><th>Снимок</th><th>Дата</th><th>Среда</th><th>СК</th><th>Статус</th><th>Последний результат</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function render() {
  document.getElementById("devReports").innerHTML = statBlock(state.reports.dev) + reportTable(state.reports.dev);
  document.getElementById("prodReports").innerHTML = statBlock(state.reports.prod) + reportTable(state.reports.prod);
  document.getElementById("devCache").innerHTML = statBlock(state.cache.dev) + cacheTable(state.cache.dev);
  document.getElementById("prodCache").innerHTML = statBlock(state.cache.prod) + cacheTable(state.cache.prod);
}

async function loadJson(path, fallback) {
  try {
    const res = await fetch(path, { cache: "no-store" });
    if (!res.ok) return fallback;
    return await res.json();
  } catch {
    return fallback;
  }
}

document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(x => x.classList.remove("active"));
    button.classList.add("active");
    document.getElementById(button.dataset.tab).classList.add("active");
  });
});

Promise.all([
  loadJson("data/reports.json", { dev: [], prod: [], updatedAt: null }),
  loadJson("data/cache.json", { dev: [], prod: [], updatedAt: null })
]).then(([reports, cache]) => {
  state.reports = { dev: reports.dev || [], prod: reports.prod || [] };
  state.cache = { dev: cache.dev || [], prod: cache.prod || [] };
  const updated = reports.updatedAt || cache.updatedAt || null;
  document.getElementById("updated").textContent = `Обновление: ${updated || "-"}`;
  render();
});

render();
</script>
</body>
</html>
